[tool.poetry]
name = "ingest-raw-data"
version = "2.0.0"
description = "Batch step: ingest raw data from source bucket"
authors = ["Amazon Web Services"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
boto3 = "1.28.57"
aws-lambda-powertools = "3.31.1"

[tool.poetry.group.test.dependencies]
pytest = "7.4.0"
pytest-cov = "6.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
