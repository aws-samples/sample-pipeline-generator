evaluate-variables: true
output: cli
skip-check:
  - CKV_AWS_18  # "Ensure S3 bucket has access logging enabled"
  - CKV_AWS_21  # "Ensure all data stored in the S3 bucket have versioning enabled"
  - CKV_AWS_51  # "Ensure ECR Image Tags are immutable"
  - CKV_AWS_52  # "Ensure S3 bucket has MFA delete enabled"
  - CKV_AWS_115 # "Ensure that AWS Lambda function is configured for function-level concurrent execution limit"
  - CKV_AWS_117 # "Ensure that AWS Lambda function is configured inside a VPC"
  - CKV_AWS_144 # "Ensure S3 bucket has cross-region replication enabled" -- not needed for our scope
  - CKV_AWS_158 # "Ensure that CloudWatch Log Group is encrypted by KMS"
  - CKV_AWS_173 # "Check encryption settings for Lambda environmental variable" -- Lambda env. variables are not secret, they are declared in plaintext in the OpenTofu state and in the code
  - CKV_AWS_272 # "Ensure AWS Lambda function is configured to validate code-signing"
  - CKV_AWS_338 # "Ensure CloudWatch log groups retains logs for at least 1 year" -- customer should be able to choose the retention period
  - CKV2_AWS_57 # "Ensure that Secrets Manager should have automatic rotation enabled"
  - CKV2_AWS_62 # "Ensure S3 buckets should have event notifications enabled"
  - CKV2_AWS_73 # "Ensure AWS SQS uses CMK not AWS default keys for encryption" -- default master key is enough for the use case
download-external-modules: false
external-modules-download-path: .external_modules
compact: true
framework:
  - terraform
  - secrets
  - dockerfile
  - terraform_plan
quiet: true
skip-framework:
  - openapi
skip-download: true
soft-fail: false
skip-path: /iac_tests
