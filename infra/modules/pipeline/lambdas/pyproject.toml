[tool.poetry]
name = "pipeline-lambdas"
version = "0.1.1"
description = "Lambda functions for pipeline module"
authors = ["Amazon Web Services"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "1.43.55"
aws-lambda-powertools = "3.31.1"
urllib3 = "2.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
moto = "5.2.2"
coverage = "7.15.2"
pytest-cov = "6.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing --cov-report=xml --cov-report=html"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "__pycache__/*", ".pytest_cache/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
